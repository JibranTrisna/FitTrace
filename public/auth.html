<style>
        .hud-border {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.2);
            border-left-color: rgba(255, 255, 255, 0.2);
        }
        .hud-glow {
            box-shadow: 0 0 15px rgba(210, 240, 0, 0.15);
        }
        .hud-line {
            background: linear-gradient(90deg, rgba(210, 240, 0, 0) 0%, rgba(210, 240, 0, 0.5) 50%, rgba(210, 240, 0, 0) 100%);
        }
        .input-glow:focus {
            box-shadow: 0 1px 0 0 #d2f000, 0 10px 20px -10px rgba(210, 240, 0, 0.2);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative selection:bg-primary-fixed selection:text-black">
    
<!-- Toast Container -->
<div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>

<!-- Ambient Background -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(30,30,30,1)_0%,rgba(18,18,18,1)_100%)]"></div>
<div class="absolute top-0 left-0 w-full h-full bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:40px_40px] opacity-20 pointer-events-none"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center relative z-10 p-gutter w-full">
<div class="w-full max-w-[1000px] grid grid-cols-1 md:grid-cols-2 gap-0 hud-border rounded-xl bg-surface-container-highest/80 backdrop-blur-xl overflow-hidden shadow-2xl hud-glow">
<!-- Left Side: Visual / Brand -->
<div class="hidden md:flex flex-col justify-between p-lg relative border-r border-white/5" data-alt="A dark, cinematic visualization of a futuristic AI core server room. Glowing neon electric lime data streams flow through monolithic black obsidian servers. High contrast, sharp details, glassmorphism UI elements floating in the air. The mood is highly technical, elite, and intense, evoking a cutting-edge high-performance laboratory. 8k resolution, photorealistic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDBqsQQcb74ylzrrfFezf-wsKbDH7Hb5qAJ_sEkBQ--OyiFxZI0SSlJac0eVF4Ww7CoLa4obs1BpH7CgB9yX3Dy_dCF0-0cvJfWgbUh_FrOblwGqw-8JZltw1d8v-XJoqcoEw7ouD-7gen4eq4l-IGjzZ57x9URFC3_v25LncF5Qp2lA2WKFTrxD74P-XiIxps2N5E4xS5620Ie-aBaUegoA-ZrjncuBJHapnC--8A3C4_52F4Sjwfk'); background-size: cover; background-position: center;">
<div class="absolute inset-0 bg-background/60 backdrop-blur-sm z-0"></div>
<div class="relative z-10">
<h1 class="font-display-lg text-display-lg text-primary-fixed uppercase italic mb-2 tracking-tighter">KINETIC AI</h1>
<p class="font-label-md text-label-md text-secondary uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
                        Engineered for Elite Performance
                    </p>
</div>
<div class="relative z-10 mt-auto">
<div class="w-full h-[1px] hud-line mb-6 opacity-30"></div>
<div class="grid grid-cols-2 gap-4">
<div>
<span class="block font-label-md text-label-md text-on-surface-variant mb-1">SYSTEM STATUS</span>
<span class="block font-stat-value text-stat-value text-primary-fixed italic">ONLINE</span>
</div>
<div>
<span class="block font-label-md text-label-md text-on-surface-variant mb-1">SERVER PING</span>
<span class="block font-stat-value text-stat-value text-primary-fixed italic">12ms</span>
</div>
</div>
</div>
</div>
<!-- Right Side: Form -->
<div class="p-lg md:p-xl flex flex-col justify-center relative bg-surface-dim/50">
<!-- Mobile Logo Fallback -->
<div class="md:hidden mb-8 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-fixed uppercase italic tracking-tighter">KINETIC AI</h1>
</div>
<!-- Protocol Toggle -->
<div class="flex items-center gap-4 mb-10 border-b border-white/10 pb-4">
<button id="tab-login" onclick="toggleFormUI('login')" class="font-label-md text-label-md uppercase tracking-wider text-primary-fixed border-b-2 border-primary-fixed pb-1 transition-colors">LOGIN</button>
<button id="tab-register" onclick="toggleFormUI('register')" class="font-label-md text-label-md uppercase tracking-wider text-secondary hover:text-primary transition-colors pb-1 border-b-2 border-transparent">REGISTER</button>
</div>

<!-- LOGIN SECTION -->
<div id="login-section">
    <form id="login-form" class="space-y-6">
        <!-- Access Key Input -->
        <div class="relative group">
        <label class="block font-label-md text-label-md text-secondary mb-2 uppercase flex items-center gap-2" for="login-username">
        <span class="material-symbols-outlined text-[16px]">fingerprint</span> Access Key
                                </label>
        <input id="login-username" required autocomplete="username" class="w-full bg-[#2A2A2A] border-0 border-b border-white/20 text-on-background font-body-md text-body-md px-4 py-3 focus:ring-0 focus:border-primary-fixed input-glow transition-all rounded-t-sm outline-none placeholder:text-on-surface-variant/50" placeholder="Enter identification string" type="text"/>
        </div>
        <!-- Neural Link Input -->
        <div class="relative group pt-4">
        <label class="block font-label-md text-label-md text-secondary mb-2 uppercase flex items-center gap-2" for="login-password">
        <span class="material-symbols-outlined text-[16px]">memory</span> Neural Link
                                </label>
        <input id="login-password" required autocomplete="current-password" class="w-full bg-[#2A2A2A] border-0 border-b border-white/20 text-on-background font-body-md text-body-md px-4 py-3 focus:ring-0 focus:border-primary-fixed input-glow transition-all rounded-t-sm outline-none placeholder:text-on-surface-variant/50" placeholder="Enter encrypted passkey" type="password"/>
        </div>
        <div class="flex items-center justify-between pt-2">
        <label class="flex items-center gap-2 cursor-pointer">
        <input class="form-checkbox bg-[#2A2A2A] border-white/20 text-primary-fixed rounded-sm focus:ring-primary-fixed focus:ring-offset-background" type="checkbox"/>
        <span class="font-label-md text-label-md text-secondary">PERSIST CONNECTION</span>
        </label>
        </div>
        <!-- Submit CTA -->
        <div class="pt-8">
        <button class="w-full bg-primary-fixed text-black font-headline-md text-headline-md uppercase italic py-4 rounded-sm hover:bg-white transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-3" type="submit">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                                    INITIATE ACCESS
                                </button>
        </div>
    </form>
</div>

<!-- REGISTER SECTION -->
<div id="register-section" class="hidden">
    <form id="register-form" class="space-y-6">
        <!-- Access Key Input -->
        <div class="relative group">
        <label class="block font-label-md text-label-md text-secondary mb-2 uppercase flex items-center gap-2" for="register-username">
        <span class="material-symbols-outlined text-[16px]">person_add</span> New Access Key
                                </label>
        <input id="register-username" required autocomplete="username" class="w-full bg-[#2A2A2A] border-0 border-b border-white/20 text-on-background font-body-md text-body-md px-4 py-3 focus:ring-0 focus:border-primary-fixed input-glow transition-all rounded-t-sm outline-none placeholder:text-on-surface-variant/50" placeholder="Create new identification string" type="text"/>
        </div>
        <!-- Neural Link Input -->
        <div class="relative group pt-4">
        <label class="block font-label-md text-label-md text-secondary mb-2 uppercase flex items-center gap-2" for="register-password">
        <span class="material-symbols-outlined text-[16px]">lock</span> Create Neural Link
                                </label>
        <input id="register-password" required autocomplete="new-password" class="w-full bg-[#2A2A2A] border-0 border-b border-white/20 text-on-background font-body-md text-body-md px-4 py-3 focus:ring-0 focus:border-primary-fixed input-glow transition-all rounded-t-sm outline-none placeholder:text-on-surface-variant/50" placeholder="Create encrypted passkey" type="password"/>
        </div>
        <!-- Submit CTA -->
        <div class="pt-16">
        <button class="w-full bg-primary-fixed text-black font-headline-md text-headline-md uppercase italic py-4 rounded-sm hover:bg-white transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-3" type="submit">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person_add</span>
                                    REGISTER PROTOCOL
                                </button>
        </div>
    </form>
</div>

<!-- Footer HUD Elements -->
<div class="mt-12 flex justify-between items-center border-t border-white/5 pt-4">
<div class="font-label-md text-[10px] text-on-surface-variant/50 uppercase tracking-widest">
                        SECURE ENCLAVE v2.4
                    </div>
<div class="flex gap-1">
<div class="w-2 h-2 bg-primary-fixed rounded-full animate-pulse"></div>
<div class="w-2 h-2 bg-primary-fixed/30 rounded-full"></div>
<div class="w-2 h-2 bg-primary-fixed/30 rounded-full"></div>
</div>
</div>
</div>
</div>
</main>

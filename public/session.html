<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Active Session - FitTrace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#051424', // Deep dark navy/obsidian
                        surface: '#0a1d36',
                        'surface-container': '#102645',
                        'surface-container-high': '#163155',
                        primary: '#c3f400', // Electric lime
                        'primary-fixed': '#abd600',
                        'primary-fixed-dim': '#abd600',
                        'on-primary': '#000000',
                        'on-surface': '#e2e8f0',
                        'on-surface-variant': '#94a3b8'
                    },
                    fontFamily: {
                        'headline-md': ['"Space Grotesk"', 'sans-serif'],
                        'body-md': ['"Inter"', 'sans-serif'],
                        'label-caps': ['"Inter"', 'sans-serif'],
                        'data-point': ['"Space Grotesk"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        body { background-color: #051424; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-card {
            background: rgba(16, 38, 69, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-32">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-card border-b border-white/5 p-4 flex items-center justify-between">
        <a href="dashboard.html" class="flex items-center gap-2 text-on-surface-variant hover:text-primary-fixed-dim transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-label-caps uppercase text-sm">Kembali</span>
        </a>
        <h1 id="session-title" class="font-headline-md text-xl text-primary-fixed-dim font-bold">Active Session</h1>
        <button id="finish-session-btn" class="bg-primary-fixed-dim text-black font-label-caps uppercase text-xs px-4 py-2 rounded-lg font-bold hover:brightness-110">
            Selesai
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-5xl mx-auto p-4 md:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- Left: Exercise List -->
        <div id="exercise-list-container" class="flex-1 space-y-6">
            <div class="text-center py-20 opacity-50">
                <span class="material-symbols-outlined animate-spin text-4xl">autorenew</span>
                <p class="mt-4 font-body-md">Memuat Data...</p>
            </div>
        </div>
        
        <!-- Right: Sticky Timer & Info -->
        <div class="w-full lg:w-[350px] shrink-0">
            <div class="sticky top-24 glass-card rounded-2xl p-6 border-t-4 border-t-primary-fixed-dim shadow-[0_0_30px_rgba(171,214,0,0.1)]">
                <h3 class="font-label-caps text-on-surface-variant text-xs uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-[16px]">timer</span> Rest Timer
                </h3>
                
                <!-- Circular Timer UI -->
                <div class="flex justify-center mb-6 relative">
                    <svg class="w-48 h-48 transform -rotate-90">
                        <circle cx="96" cy="96" r="88" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="none" />
                        <circle id="timer-progress" cx="96" cy="96" r="88" stroke="#abd600" stroke-width="8" fill="none" stroke-dasharray="553" stroke-dashoffset="0" class="transition-all duration-1000 ease-linear" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="timer-display" class="font-data-point text-5xl font-bold text-on-surface tracking-tighter">00:00</span>
                        <span id="timer-status" class="font-label-caps text-[10px] text-primary-fixed-dim uppercase mt-1">Ready</span>
                    </div>
                </div>

                <!-- Timer Controls -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button onclick="addTime(30)" class="bg-surface-container hover:bg-surface-container-high border border-white/5 rounded-lg py-2 text-xs font-bold text-on-surface transition-colors">+30s</button>
                    <button onclick="addTime(60)" class="bg-surface-container hover:bg-surface-container-high border border-white/5 rounded-lg py-2 text-xs font-bold text-on-surface transition-colors">+60s</button>
                    <button onclick="addTime(90)" class="bg-surface-container hover:bg-surface-container-high border border-white/5 rounded-lg py-2 text-xs font-bold text-on-surface transition-colors">+90s</button>
                </div>
                
                <div class="flex gap-2">
                    <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex-1 bg-primary-fixed-dim text-black font-bold py-3 rounded-lg flex justify-center items-center gap-2 hover:brightness-110 transition-colors">
                        <span class="material-symbols-outlined" id="timer-toggle-icon">play_arrow</span>
                        <span id="timer-toggle-text">Start Rest</span>
                    </button>
                    <button onclick="resetTimer()" class="w-12 bg-surface-container border border-white/10 hover:border-white/30 rounded-lg flex justify-center items-center text-on-surface-variant transition-colors">
                        <span class="material-symbols-outlined text-[20px]">replay</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/guard.js"></script>
    <script src="js/exercisesDB.js"></script>
    <script src="js/session.js?v=4"></script>
</body>
</html>
